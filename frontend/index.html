
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Used Car Price Prediction</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <header>
            <h1>🚗 Used Car Price Prediction</h1>
            <p>Find the estimated value of your car using Machine Learning</p>
        </header>

        <div class="form-container">
            <h2>Enter Car Details</h2>

            <form id="carForm">

                <label>Car Brand</label>
                <select id="brand" required>
                    <option value="">Select Brand</option>
                </select>
                <label>Car Model / Name</label>
<select id="name" required>
    <option value="">Select Car Model</option>
</select>

                <label>Manufacturing Year</label>
                <input type="number" id="year" min="1990" max="2026" placeholder="e.g. 2020" required>

                <label>Kilometres Driven</label>
                <input type="number" id="km_driven" min="1" placeholder="e.g. 50000" required>

                <label>Fuel Type</label>
                <select id="fuel" required>
                    <option value="">Select Fuel</option>
                    <option>Petrol</option>
                    <option>Diesel</option>
                    <option>CNG</option>
                    <option>LPG</option>
                    <option>Electric</option>
                </select>

                <label>Seller Type</label>
                <select id="seller_type" required>
                    <option value="">Select Seller</option>
                    <option>Individual</option>
                    <option>Dealer</option>
                    <option>Trustmark Dealer</option>
                </select>

                <label>Transmission</label>
                <select id="transmission" required>
                    <option value="">Select Transmission</option>
                    <option>Manual</option>
                    <option>Automatic</option>
                </select>

                <label>Number of Previous Owners</label>
                <select id="owner" required>
                    <option value="">Select Owner</option>
                    <option>First Owner</option>
                    <option>Second Owner</option>
                    <option>Third Owner</option>
                    <option>Fourth & Above Owner</option>
                    <option>Test Drive Car</option>
                </select>

                <button type="submit">Predict Car Price</button>

            </form>

            <div id="result"></div>
        </div>

        <footer>
            <p>Powered by Machine Learning | Random Forest Regression</p>
        </footer>
    </div>

    <script src="script.js"></script>
</body>
</html>
